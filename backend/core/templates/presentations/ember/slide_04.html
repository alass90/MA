<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ember - Stats</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1920px; height: 1080px; overflow: hidden; }
    .slide { width: 1920px; height: 1080px; background: #0f0500; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column; padding: 80px 120px; }
    .header { margin-bottom: 50px; display: flex; justify-content: space-between; align-items: flex-end; }
    .label { font-size: 13px; color: #ff6b35; letter-spacing: 5px; text-transform: uppercase; font-weight: 600; margin-bottom: 12px; }
    .title { font-family: 'Barlow Condensed', sans-serif; font-size: 72px; font-weight: 900; color: white; text-transform: uppercase; }
    .title span { color: #ff4500; }
    .num { font-family: 'Barlow Condensed', sans-serif; font-size: 120px; font-weight: 900; color: rgba(255,69,0,0.1); line-height: 1; }
    .stats-main { display: grid; grid-template-columns: 2fr repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
    .stat-hero { background: linear-gradient(135deg, #ff4500, #ff6b35); padding: 50px 60px; display: flex; flex-direction: column; justify-content: space-between; }
    .stat-hero .value { font-family: 'Barlow Condensed', sans-serif; font-size: 140px; font-weight: 900; color: white; line-height: 1; }
    .stat-hero .label { font-size: 22px; color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
    .stat-hero .change { font-size: 18px; color: rgba(255,255,255,0.6); }
    .stat { border: 1px solid rgba(255,69,0,0.25); padding: 40px 32px; display: flex; flex-direction: column; justify-content: space-between; }
    .stat .value { font-family: 'Barlow Condensed', sans-serif; font-size: 80px; font-weight: 900; color: white; line-height: 1; }
    .stat .unit { color: #ff4500; }
    .stat .label { font-size: 16px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }
    .stat .change { font-size: 14px; color: #ff6b35; }
    .bottom-bar { display: flex; gap: 20px; }
    .bar-item { flex: 1; border-top: 2px solid rgba(255,69,0,0.3); padding: 20px 0; }
    .bar-item-label { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .bar-name { font-size: 15px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    .bar-pct { font-size: 15px; color: #ff6b35; font-weight: 700; }
    .bar-track { height: 4px; background: rgba(255,69,0,0.15); }
    .bar-fill { height: 4px; background: linear-gradient(90deg, #ff4500, #ff6b35); }
  </style>
</head>
<body>
  <div class="slide">
    <div class="header">
      <div>
        <div class="label">Traction</div>
        <div class="title">The <span>Numbers</span> Don't Lie</div>
      </div>
      <div class="num">04</div>
    </div>
    <div class="stats-main">
      <div class="stat-hero">
        <div class="value">$30M</div>
        <div>
          <div class="label">ARR</div>
          <div class="change">↑ +400% year over year</div>
        </div>
      </div>
      <div class="stat">
        <div><span class="value">1.2</span><span class="unit">M</span></div>
        <div>
          <div class="label">Users</div>
          <div class="change">↑ +250%</div>
        </div>
      </div>
      <div class="stat">
        <div><span class="value">93</span><span class="unit">%</span></div>
        <div>
          <div class="label">Retention</div>
          <div class="change">↑ +15pp</div>
        </div>
      </div>
      <div class="stat">
        <div><span class="value">18</span><span class="unit">mo</span></div>
        <div>
          <div class="label">Runway</div>
          <div class="change">↑ well funded</div>
        </div>
      </div>
    </div>
    <div class="bottom-bar">
      <div class="bar-item"><div class="bar-item-label"><div class="bar-name">Enterprise</div><div class="bar-pct">45%</div></div><div class="bar-track"><div class="bar-fill" style="width:45%"></div></div></div>
      <div class="bar-item"><div class="bar-item-label"><div class="bar-name">Mid-Market</div><div class="bar-pct">35%</div></div><div class="bar-track"><div class="bar-fill" style="width:35%"></div></div></div>
      <div class="bar-item"><div class="bar-item-label"><div class="bar-name">SMB</div><div class="bar-pct">20%</div></div><div class="bar-track"><div class="bar-fill" style="width:20%"></div></div></div>
    </div>
  </div>
</body>
</html>
