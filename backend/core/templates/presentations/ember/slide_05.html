<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ember - Closing</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1920px; height: 1080px; overflow: hidden; }
    .slide { width: 1920px; height: 1080px; background: #0f0500; font-family: 'Barlow', sans-serif; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .fire-bottom { position: absolute; bottom: -100px; left: 0; right: 0; height: 400px; background: radial-gradient(ellipse at 50% 100%, #ff4500 0%, #c0392b 30%, transparent 70%); opacity: 0.5; }
    .glow-center { position: absolute; width: 1000px; height: 500px; background: radial-gradient(ellipse, rgba(255,69,0,0.15) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .content { position: relative; z-index: 2; text-align: center; }
    .label { font-size: 14px; color: rgba(255,107,53,0.6); letter-spacing: 6px; text-transform: uppercase; font-weight: 600; margin-bottom: 24px; }
    .title { font-family: 'Barlow Condensed', sans-serif; font-size: 160px; font-weight: 900; color: white; line-height: 0.9; text-transform: uppercase; letter-spacing: -3px; margin-bottom: 10px; }
    .title-fire { color: #ff4500; text-shadow: 0 0 60px rgba(255,69,0,0.6); }
    .line { width: 120px; height: 4px; background: linear-gradient(90deg, #ff4500, #ff6b35); margin: 40px auto; }
    .cta { font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 700; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 60px; }
    .contact-row { display: flex; gap: 50px; justify-content: center; }
    .contact { font-size: 18px; color: rgba(255,107,53,0.5); letter-spacing: 2px; }
    .contact strong { color: rgba(255,107,53,0.8); }
  </style>
</head>
<body>
  <div class="slide">
    <div class="fire-bottom"></div>
    <div class="glow-center"></div>
    <div class="content">
      <div class="label">Thank You</div>
      <div class="title">
        <div>Let's</div>
        <div class="title-fire">Burn.</div>
      </div>
      <div class="line"></div>
      <div class="cta">Questions? Let's talk. We move fast.</div>
      <div class="contact-row">
        <div class="contact"><strong>hello@</strong>yourcompany.com</div>
        <div class="contact">·</div>
        <div class="contact"><strong>www.</strong>yourcompany.com</div>
        <div class="contact">·</div>
        <div class="contact"><strong>2025</strong></div>
      </div>
    </div>
  </div>
</body>
</html>
