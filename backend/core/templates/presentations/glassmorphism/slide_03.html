<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Glass - Slide 3 (Image Right)</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --accent: #FF2079;
    }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      font-family: 'Outfit', sans-serif;
      background: url('assets/bg.png') no-repeat center center fixed; 
      background-size: cover;
      color: var(--text-primary);
      overflow: hidden;
    }
    .slide-container {
      width: 1920px; height: 1080px; position: relative;
      padding: 100px; box-sizing: border-box;
      display: flex; flex-direction: column;
    }
    .header { display: flex; align-items: center; margin-bottom: 50px; }
    .accent-line { width: 80px; height: 6px; background: var(--accent); border-radius: 3px; margin-right: 30px; box-shadow: 0 0 20px rgba(255,32,121,0.5); }
    .slide-title { font-size: 64px; font-weight: 600; margin: 0; letter-spacing: -1px; }
    
    .split-layout { display: flex; gap: 80px; flex: 1; align-items: stretch; }
    
    .text-side { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .glass-text-box {
      background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 60px;
      position: relative;
    }
    .glass-text-box::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    }
    .description { font-size: 32px; line-height: 1.6; color: var(--text-secondary); font-weight: 300; margin-bottom: 40px; }
    .stat-row { display: flex; gap: 40px; }
    .stat { display: flex; flex-direction: column; }
    .stat-val { font-size: 56px; font-weight: 700; color: var(--text-primary); margin-bottom: 5px; }
    .stat-label { font-size: 20px; color: var(--accent); font-weight: 500; text-transform: uppercase; letter-spacing: 2px; }
    
    .image-side { flex: 1; border-radius: 24px; overflow: hidden; position: relative; }
    .image-placeholder {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
      backdrop-filter: blur(10px);
    }
    .image-placeholder img {
      width: 100%; height: 100%; object-fit: cover; border-radius: 24px;
    }
    
    .slide-number { position: absolute; bottom: 50px; right: 100px; font-size: 24px; font-weight: 500; color: rgba(255,255,255,0.3); }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="header">
      <div class="accent-line"></div>
      <h2 class="slide-title">Unprecedented Growth</h2>
    </div>
    
    <div class="split-layout">
      <div class="text-side">
        <div class="glass-text-box">
          <p class="description">By leveraging advanced predictive modeling and a modernized tech stack, our Q3 performance shattered all previous constraints, opening the door for global expansion.</p>
          
          <div class="stat-row">
            <div class="stat">
              <span class="stat-val">340%</span>
              <span class="stat-label">YoY Growth</span>
            </div>
            <div class="stat">
              <span class="stat-val">2.4M</span>
              <span class="stat-label">Active Users</span>
            </div>
          </div>
        </div>
      </div>
      
      <div class="image-side">
        <div class="image-placeholder">
          <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=2070&auto=format&fit=crop" alt="Abstract Data Visualization" />
        </div>
      </div>
    </div>
    
    <div class="slide-number">03</div>
  </div>
</body>
</html>
