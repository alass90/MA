<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Glass - Slide 1 (Title)</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --accent: #FF2079;
    }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      font-family: 'Outfit', sans-serif;
      background: #0f0c29;  /* fallback */
      background: url('assets/bg.png') no-repeat center center fixed; 
      background-size: cover;
      display: flex; justify-content: center; align-items: center;
      color: var(--text-primary);
      overflow: hidden;
    }
    .slide-container {
      width: 1920px; height: 1080px; position: relative;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 80px 120px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      max-width: 1400px;
    }
    /* Inner glow */
    .glass-panel::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    }
    .title {
      font-size: 110px; font-weight: 700; margin: 0 0 30px 0;
      letter-spacing: -2px; line-height: 1.1;
      background: linear-gradient(to right, #fff, rgba(255,255,255,0.7));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 42px; font-weight: 300; color: var(--text-secondary); margin: 0;
      letter-spacing: 1px;
    }
    .badge {
      display: inline-block; padding: 10px 25px; border-radius: 50px;
      background: rgba(255,32,121,0.2); border: 1px solid rgba(255,32,121,0.5);
      color: #FF2079; font-size: 20px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; margin-bottom: 40px;
    }
    .footer {
      position: absolute; bottom: 50px; left: 80px; right: 80px;
      display: flex; justify-content: space-between;
      font-size: 24px; color: var(--text-secondary); font-weight: 300;
    }
    .orb-1, .orb-2 { position: absolute; border-radius: 50%; filter: blur(80px); z-index: -1; }
    .orb-1 { width: 400px; height: 400px; background: rgba(255,32,121,0.3); top: -100px; left: -100px; }
    .orb-2 { width: 500px; height: 500px; background: rgba(10,255,255,0.2); bottom: -150px; right: -150px; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="orb-1"></div>
    <div class="orb-2"></div>
    <div class="glass-panel">
      <div class="badge">Innovation</div>
      <h1 class="title">The Future of<br>Glassmorphism</h1>
      <p class="subtitle">Elevating presentations to the next aesthetic level</p>
    </div>
    
    <div class="footer">
      <div>Glass Template v1.0</div>
      <div>2024 Design Trends</div>
    </div>
  </div>
</body>
</html>
