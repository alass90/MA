<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyberpunk - Slide 3 (Image Right)</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --text-primary: #E0E0E0; --text-secondary: #A0A0A0;
      --accent: #00F0FF; --accent-secondary: #FF003C;
      --bg-panel: rgba(10, 10, 15, 0.85); --border-color: rgba(0, 240, 255, 0.4);
    }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      font-family: 'Rajdhani', sans-serif;
      background: url('assets/bg.png') no-repeat center center fixed; background-size: cover;
      color: var(--text-primary); overflow: hidden;
    }
    .slide-container {
      width: 1920px; height: 1080px; position: relative; padding: 80px 100px; box-sizing: border-box;
      display: flex; flex-direction: column; background: rgba(0,0,0,0.5);
    }
    .header {
      display: flex; align-items: center; margin-bottom: 50px; border-bottom: 2px solid var(--accent-secondary); padding-bottom: 20px; position: relative;
    }
    .header::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100px; height: 2px; background: var(--accent); }
    .slide-title {
      font-family: 'Orbitron', sans-serif; font-size: 55px; font-weight: 700; margin: 0; text-transform: uppercase; letter-spacing: 3px;
      color: var(--accent); text-shadow: 0 0 10px rgba(0,240,255,0.5);
    }
    .system-status { margin-left: auto; font-size: 24px; color: var(--accent-secondary); font-weight: 700; font-family: 'Orbitron', sans-serif; }
    
    .split-layout { display: flex; gap: 80px; flex: 1; align-items: stretch; }
    
    .text-side { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .glitch-text-box {
      background: var(--bg-panel); border: 1px solid var(--border-color); padding: 50px; position: relative;
      box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.1);
    }
    .glitch-text-box::before { content: ''; position: absolute; top: -5px; right: 50px; width: 80px; height: 5px; background: var(--accent-secondary); }
    
    .description { font-size: 32px; line-height: 1.6; color: var(--text-secondary); margin-bottom: 40px; }
    .stat-row { display: flex; gap: 40px; }
    .stat { display: flex; flex-direction: column; border-left: 2px solid var(--accent); padding-left: 20px; }
    .stat-val { font-family: 'Orbitron', sans-serif; font-size: 50px; font-weight: 700; color: var(--accent-secondary); margin-bottom: 5px; text-shadow: 0 0 15px rgba(255,0,60,0.5); }
    .stat-label { font-size: 20px; color: var(--text-primary); text-transform: uppercase; letter-spacing: 2px; }
    
    .image-side { flex: 1; border: 2px solid var(--border-color); position: relative; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
    .image-side::after {
      content: 'SCANNING...'; position: absolute; top: 20px; right: 20px; color: var(--accent); font-family: 'Orbitron', sans-serif; font-size: 16px; letter-spacing: 2px;
    }
    .image-side img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; mix-blend-mode: screen; }
    .scanline {
      width: 100%; height: 2px; background: rgba(0,240,255,0.5); position: absolute; top: 0; left: 0; box-shadow: 0 0 10px var(--accent);
      animation: scan 4s linear infinite;
    }
    @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
    
    .slide-number { position: absolute; bottom: 50px; right: 100px; font-size: 30px; font-weight: 700; font-family: 'Orbitron', sans-serif; color: var(--accent); }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="header">
      <h2 class="slide-title">MARKET PENETRATION</h2>
      <div class="system-status">SECTOR 8 [ACTIVE]</div>
    </div>
    
    <div class="split-layout">
      <div class="text-side">
        <div class="glitch-text-box">
          <p class="description">Our synthetics have achieved unprecedented integration into mainstream consumer sectors. The takeover is proceeding exactly as simulated in our quantum models.</p>
          
          <div class="stat-row">
            <div class="stat">
              <span class="stat-val">89.4%</span>
              <span class="stat-label">Market Share</span>
            </div>
            <div class="stat">
              <span class="stat-val">12M+</span>
              <span class="stat-label">Connected Nodes</span>
            </div>
          </div>
        </div>
      </div>
      
      <div class="image-side">
        <div class="scanline"></div>
        <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070&auto=format&fit=crop" alt="Cyber Cityscape" />
      </div>
    </div>
    
    <div class="slide-number">03</div>
  </div>
</body>
</html>
