<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bloom - Title Slide</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1920px; height: 1080px; overflow: hidden; }
    .slide { width: 1920px; height: 1080px; background: #fdf6f0; display: flex; align-items: center; justify-content: center; font-family: 'Nunito', sans-serif; position: relative; overflow: hidden; }
    .blob1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, #fce4ec 0%, transparent 70%); top: -200px; left: -100px; border-radius: 50%; }
    .blob2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, #e8f5e9 0%, transparent 70%); bottom: -150px; right: -50px; border-radius: 50%; }
    .blob3 { position: absolute; width: 300px; height: 300px; background: radial-gradient(circle, #fce4ec 0%, transparent 70%); bottom: 100px; left: 600px; border-radius: 50%; }
    .card {
      position: relative; z-index: 2;
      background: rgba(255,255,255,0.85); border-radius: 40px;
      padding: 100px 120px; max-width: 1200px; text-align: center;
      border: 1px solid rgba(236,153,175,0.3);
      box-shadow: 0 30px 80px rgba(236,153,175,0.15);
    }
    .petal { font-size: 40px; margin-bottom: 24px; }
    .eyebrow { font-size: 15px; color: #e87d8d; letter-spacing: 4px; text-transform: uppercase; font-weight: 600; margin-bottom: 24px; }
    .title { font-family: 'DM Serif Display', serif; font-size: 90px; color: #3d2b35; line-height: 1.1; margin-bottom: 32px; }
    .title em { color: #e87d8d; font-style: italic; }
    .divider { display: flex; align-items: center; gap: 20px; justify-content: center; margin: 32px 0; }
    .divider-line { width: 80px; height: 1px; background: rgba(232,125,141,0.4); }
    .divider-dot { width: 8px; height: 8px; background: #e87d8d; border-radius: 50%; }
    .subtitle { font-size: 24px; color: #8b6e7a; line-height: 1.7; font-weight: 400; }
    .meta { margin-top: 48px; font-size: 16px; color: #b8a4ac; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="blob1"></div>
    <div class="blob2"></div>
    <div class="blob3"></div>
    <div class="card">
      <div class="petal">🌸</div>
      <div class="eyebrow">Bloom Presentation</div>
      <div class="title">Where <em>Ideas</em><br>Come to Life</div>
      <div class="divider"><div class="divider-line"></div><div class="divider-dot"></div><div class="divider-line"></div></div>
      <div class="subtitle">A presentation template as delicate and purposeful<br>as the ideas you're here to share</div>
      <div class="meta">2025 · Your Name · Your Company</div>
    </div>
  </div>
</body>
</html>
