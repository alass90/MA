<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Circuit - Closing</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1920px; height: 1080px; overflow: hidden; }
    .slide { width: 1920px; height: 1080px; background: #020a04; font-family: 'JetBrains Mono', monospace; display: flex; align-items: center; justify-content: center; position: relative; }
    .grid-bg { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,255,65,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,65,0.03) 1px, transparent 1px); background-size: 60px 60px; }
    .glow { position: absolute; width: 800px; height: 800px; background: radial-gradient(circle, rgba(0,255,65,0.12) 0%, transparent 70%); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .content { position: relative; z-index: 2; text-align: center; }
    .prompt { font-size: 16px; color: rgba(0,255,65,0.5); letter-spacing: 3px; margin-bottom: 24px; }
    .title { font-size: 120px; font-weight: 800; color: white; line-height: 0.9; margin-bottom: 8px; }
    .title-green { color: #00ff41; text-shadow: 0 0 40px rgba(0,255,65,0.4); }
    .cursor { display: inline-block; width: 12px; height: 90px; background: #00ff41; margin-left: 8px; vertical-align: middle; box-shadow: 0 0 20px #00ff41; }
    .divider { width: 100px; height: 1px; background: linear-gradient(90deg, transparent, #00ff41, transparent); margin: 40px auto; }
    .message { font-size: 20px; color: rgba(255,255,255,0.3); font-family: 'Inter', sans-serif; letter-spacing: 1px; margin-bottom: 60px; }
    .contact-grid { display: flex; gap: 40px; justify-content: center; }
    .contact-item { border: 1px solid rgba(0,255,65,0.2); padding: 16px 32px; font-size: 16px; color: rgba(0,255,65,0.6); letter-spacing: 2px; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="grid-bg"></div>
    <div class="glow"></div>
    <div class="content">
      <div class="prompt">$ echo "thank_you"</div>
      <div class="title"><div class="title-green">EOF<span class="cursor"></span></div></div>
      <div class="divider"></div>
      <div class="message">// end of presentation · questions welcome · let's build something great</div>
      <div class="contact-grid">
        <div class="contact-item">hello@yourcompany.com</div>
        <div class="contact-item">github.com/yourhandle</div>
        <div class="contact-item">yourcompany.com</div>
      </div>
    </div>
  </div>
</body>
</html>
