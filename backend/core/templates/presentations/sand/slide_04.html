<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sand - Stats</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1920px; height: 1080px; overflow: hidden; }
    .slide { width: 1920px; height: 1080px; background: #f7f0e6; font-family: 'Libre Baskerville', serif; display: flex; flex-direction: column; padding: 90px 140px; }
    .top-strip { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: #a08060; }
    .header { margin-bottom: 60px; display: flex; justify-content: space-between; align-items: flex-end; }
    .label { font-family: 'Source Serif 4', serif; font-size: 13px; color: #a08060; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 14px; font-weight: 300; }
    .title { font-size: 56px; font-weight: 700; color: #2d1f0a; }
    .num { font-family: 'Source Serif 4', serif; font-size: 100px; font-weight: 300; font-style: italic; color: rgba(160,128,96,0.12); line-height: 1; }
    .top-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-bottom: 28px; }
    .stat { border: 1px solid rgba(160,128,96,0.3); padding: 40px 36px; background: rgba(255,255,255,0.5); }
    .stat-value { font-size: 72px; font-weight: 700; color: #2d1f0a; line-height: 1; margin-bottom: 6px; }
    .stat-unit { font-size: 36px; color: #a08060; }
    .stat-label { font-family: 'Source Serif 4', serif; font-size: 15px; color: #8b7355; font-style: italic; margin-bottom: 6px; }
    .stat-change { font-size: 14px; color: #6a8f6a; font-weight: 700; font-family: 'Source Serif 4', serif; }
    .bottom { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
    .bottom-left { border: 1px solid rgba(160,128,96,0.3); padding: 40px 44px; background: rgba(255,255,255,0.5); }
    .bottom-right { border: 1px solid rgba(160,128,96,0.3); padding: 40px 44px; background: #2d1f0a; }
    .bottom-title { font-size: 20px; font-weight: 700; color: #2d1f0a; margin-bottom: 20px; }
    .bar-row { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
    .bar-name { font-family: 'Source Serif 4', serif; font-size: 15px; color: #8b7355; font-style: italic; min-width: 120px; }
    .bar-track { flex: 1; height: 6px; background: rgba(160,128,96,0.15); }
    .bar-fill { height: 6px; background: #a08060; }
    .bar-pct { font-size: 14px; color: #a08060; font-weight: 700; min-width: 40px; }
    .highlight { font-family: 'Source Serif 4', serif; font-size: 28px; font-style: italic; color: #c4a07a; line-height: 1.5; }
    .highlight-num { font-family: 'Libre Baskerville', serif; font-size: 80px; font-weight: 700; color: white; line-height: 1; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="top-strip"></div>
    <div class="header">
      <div>
        <div class="label">Evidence</div>
        <div class="title">The Proof in Our Work</div>
      </div>
      <div class="num">04</div>
    </div>
    <div class="top-stats">
      <div class="stat">
        <div><span class="stat-value">96</span><span class="stat-unit">%</span></div>
        <div class="stat-label">Client Retention</div>
        <div class="stat-change">↑ 8 years running</div>
      </div>
      <div class="stat">
        <div><span class="stat-value">$40</span><span class="stat-unit">M</span></div>
        <div class="stat-label">Client Revenue Generated</div>
        <div class="stat-change">↑ cumulative impact</div>
      </div>
      <div class="stat">
        <div><span class="stat-value">140</span><span class="stat-unit">+</span></div>
        <div class="stat-label">Projects Delivered</div>
        <div class="stat-change">↑ on time, every time</div>
      </div>
      <div class="stat">
        <div><span class="stat-value">4.9</span><span class="stat-unit">★</span></div>
        <div class="stat-label">Average Rating</div>
        <div class="stat-change">↑ from 200+ reviews</div>
      </div>
    </div>
    <div class="bottom">
      <div class="bottom-left">
        <div class="bottom-title">Work by Category</div>
        <div class="bar-row"><div class="bar-name">Strategy</div><div class="bar-track"><div class="bar-fill" style="width:72%"></div></div><div class="bar-pct">72%</div></div>
        <div class="bar-row"><div class="bar-name">Design</div><div class="bar-track"><div class="bar-fill" style="width:58%"></div></div><div class="bar-pct">58%</div></div>
        <div class="bar-row"><div class="bar-name">Research</div><div class="bar-track"><div class="bar-fill" style="width:44%"></div></div><div class="bar-pct">44%</div></div>
      </div>
      <div class="bottom-right">
        <div class="highlight">Average years with each client</div>
        <div class="highlight-num">4.2</div>
      </div>
    </div>
  </div>
</body>
</html>
