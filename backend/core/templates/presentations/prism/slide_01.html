<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prism - Title Slide</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1920px; height: 1080px; overflow: hidden; }
    .slide { width: 1920px; height: 1080px; background: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; position: relative; overflow: hidden; }
    .geo-left { position: absolute; left: 0; top: 0; width: 900px; height: 100%; }
    .geo-block1 { position: absolute; width: 520px; height: 520px; background: linear-gradient(135deg, #f72585, #7209b7); border-radius: 0 0 80% 0; top: 0; left: 0; }
    .geo-block2 { position: absolute; width: 380px; height: 380px; background: linear-gradient(135deg, #4361ee, #4cc9f0); border-radius: 0 80% 0 0; bottom: 0; left: 0; }
    .geo-block3 { position: absolute; width: 200px; height: 200px; background: linear-gradient(135deg, #f77f00, #fcbf49); border-radius: 50%; top: 50%; left: 340px; transform: translateY(-50%); }
    .content { position: relative; z-index: 2; margin-left: 680px; display: flex; flex-direction: column; justify-content: center; padding: 80px 100px; flex: 1; }
    .eyebrow { font-size: 16px; font-weight: 600; letter-spacing: 5px; text-transform: uppercase; color: #7209b7; margin-bottom: 32px; }
    .title { font-size: 96px; font-weight: 800; line-height: 1.0; color: #0d0d0d; margin-bottom: 32px; letter-spacing: -2px; }
    .title span { background: linear-gradient(90deg, #f72585, #7209b7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .subtitle { font-size: 26px; font-weight: 400; color: #6b7280; line-height: 1.6; max-width: 560px; margin-bottom: 50px; }
    .tags { display: flex; gap: 12px; }
    .tag { padding: 10px 24px; border-radius: 30px; font-size: 15px; font-weight: 600; }
    .tag-1 { background: #f72585; color: white; }
    .tag-2 { background: #4361ee; color: white; }
    .tag-3 { background: #f77f00; color: white; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="geo-left">
      <div class="geo-block1"></div>
      <div class="geo-block2"></div>
      <div class="geo-block3"></div>
    </div>
    <div class="content">
      <div class="eyebrow">Prism Presentation</div>
      <div class="title">Bold Ideas<br><span>Bright Future</span></div>
      <div class="subtitle">A dynamic presentation template built for teams who aren't afraid to stand out and make an impact.</div>
      <div class="tags">
        <div class="tag tag-1">Innovation</div>
        <div class="tag tag-2">Strategy</div>
        <div class="tag tag-3">Growth</div>
      </div>
    </div>
  </div>
</body>
</html>
