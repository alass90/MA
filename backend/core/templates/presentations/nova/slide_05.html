<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nova - Closing</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1920px; height: 1080px; overflow: hidden; }
    .slide {
      width: 1920px; height: 1080px;
      background: radial-gradient(ellipse at center, #1a0a3d 0%, #08071a 70%);
      font-family: 'Space Grotesk', sans-serif; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; position: relative; overflow: hidden;
    }
    .glow { position: absolute; width: 800px; height: 800px; border-radius: 50%; background: radial-gradient(circle, rgba(124,58,237,0.3) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(124,58,237,0.15); }
    .ring-1 { width: 600px; height: 600px; top: 50%; left: 50%; transform: translate(-50%,-50%); }
    .ring-2 { width: 900px; height: 900px; top: 50%; left: 50%; transform: translate(-50%,-50%); }
    .content { position: relative; z-index: 2; }
    .eyebrow { font-size: 16px; color: #7c3aed; letter-spacing: 5px; text-transform: uppercase; font-weight: 500; margin-bottom: 32px; }
    .title {
      font-size: 100px; font-weight: 700; line-height: 1.05;
      background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 50%, #7c3aed 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 32px;
    }
    .subtitle { font-size: 26px; color: #6b7280; font-family: 'Inter', sans-serif; margin-bottom: 64px; }
    .cta {
      display: inline-block; padding: 20px 60px; border-radius: 60px;
      background: linear-gradient(135deg, #7c3aed, #e879f9); color: white;
      font-size: 22px; font-weight: 600; letter-spacing: 1px;
      margin-bottom: 60px;
    }
    .contact { font-size: 18px; color: #4b5563; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="content">
      <div class="eyebrow">Thank You</div>
      <div class="title">Let's Build<br>the Future</div>
      <div class="subtitle">Questions, ideas, or next steps — we're ready to move forward together</div>
      <div class="cta">Get In Touch</div>
      <div class="contact">hello@yourcompany.com · www.yourcompany.com</div>
    </div>
  </div>
</body>
</html>
