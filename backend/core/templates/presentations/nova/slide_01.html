<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova - Title Slide</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1920px; height: 1080px; overflow: hidden; background: #08071a; }
    .slide {
      width: 1920px; height: 1080px;
      background: radial-gradient(ellipse at 20% 50%, #1a0a3d 0%, #08071a 60%),
                  radial-gradient(ellipse at 80% 20%, #0d1a3d 0%, transparent 60%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Grotesk', sans-serif; position: relative; overflow: hidden;
    }
    .stars {
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 35%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(2px 2px at 15% 75%, rgba(200,150,255,0.4) 0%, transparent 100%),
        radial-gradient(2px 2px at 60% 45%, rgba(200,150,255,0.3) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 90% 60%, rgba(255,255,255,0.5) 0%, transparent 100%);
    }
    .glow-orb {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3;
    }
    .glow-orb.left { width: 600px; height: 600px; background: #7c3aed; top: 50%; left: -100px; transform: translateY(-50%); }
    .glow-orb.right { width: 400px; height: 400px; background: #4f46e5; top: -50px; right: 100px; }
    .content { position: relative; z-index: 2; text-align: center; max-width: 1200px; padding: 0 100px; }
    .eyebrow {
      font-size: 18px; font-weight: 500; letter-spacing: 6px; text-transform: uppercase;
      color: #a78bfa; margin-bottom: 40px; opacity: 0.9;
    }
    .title {
      font-size: 120px; font-weight: 700; line-height: 1.0;
      background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 40%, #a78bfa 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 40px; letter-spacing: -3px;
    }
    .subtitle {
      font-size: 28px; font-weight: 300; color: #8b8fa8; letter-spacing: 1px;
      font-family: 'Inter', sans-serif; line-height: 1.6;
    }
    .divider {
      width: 80px; height: 2px;
      background: linear-gradient(90deg, #7c3aed, #e879f9);
      margin: 40px auto;
    }
    .meta { font-size: 18px; color: #6b7280; letter-spacing: 2px; font-weight: 400; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="stars"></div>
    <div class="glow-orb left"></div>
    <div class="glow-orb right"></div>
    <div class="content">
      <div class="eyebrow">Nova Presentation</div>
      <div class="title">Your Title Here</div>
      <div class="divider"></div>
      <div class="subtitle">A compelling subtitle that captures attention<br>and sets the tone for your presentation</div>
      <div class="meta" style="margin-top: 60px;">2025 · Your Company</div>
    </div>
  </div>
</body>
</html>
