<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clay - Title Slide</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1920px; height: 1080px; overflow: hidden; }
    .slide {
      width: 1920px; height: 1080px;
      background: #f5ece0; display: flex; font-family: 'Fraunces', serif; position: relative; overflow: hidden;
    }
    .bg-shape-1 {
      position: absolute; width: 700px; height: 700px; border-radius: 50%;
      background: radial-gradient(circle, #e8c4a0 0%, transparent 70%);
      top: -200px; right: -100px; opacity: 0.6;
    }
    .bg-shape-2 {
      position: absolute; width: 400px; height: 400px; border-radius: 50%;
      background: #c4705a; opacity: 0.08;
      bottom: -100px; left: 300px;
    }
    .left {
      width: 680px; background: #c4705a;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 90px 80px; position: relative; overflow: hidden;
    }
    .left::after {
      content: ''; position: absolute; width: 500px; height: 500px;
      background: rgba(0,0,0,0.08); border-radius: 50%;
      bottom: -200px; right: -150px;
    }
    .logo { font-size: 18px; font-weight: 300; color: rgba(255,255,255,0.7); letter-spacing: 4px; text-transform: uppercase; }
    .main-title {
      font-size: 110px; font-weight: 900; color: white; line-height: 0.95;
      letter-spacing: -2px; position: relative; z-index: 2;
    }
    .main-subtitle { font-size: 24px; color: rgba(255,255,255,0.8); font-family: 'Crimson Text', serif; font-style: italic; margin-top: 20px; position: relative; z-index: 2; }
    .year { font-size: 16px; color: rgba(255,255,255,0.5); letter-spacing: 3px; }
    .right {
      flex: 1; padding: 90px 100px;
      display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 2;
    }
    .eyebrow { font-size: 15px; color: #c4705a; letter-spacing: 4px; text-transform: uppercase; font-weight: 400; font-family: 'Crimson Text', serif; margin-bottom: 24px; }
    .right-title { font-size: 56px; font-weight: 600; color: #2d1f14; line-height: 1.2; margin-bottom: 30px; }
    .right-desc { font-size: 22px; color: #8b6e57; font-family: 'Crimson Text', serif; line-height: 1.8; max-width: 580px; }
    .divider { width: 50px; height: 2px; background: #c4705a; margin: 30px 0; }
    .tags { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 50px; }
    .tag { padding: 8px 20px; border: 1px solid #d4a08a; border-radius: 30px; font-size: 15px; color: #8b6e57; font-family: 'Crimson Text', serif; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-shape-1"></div>
    <div class="bg-shape-2"></div>
    <div class="left">
      <div class="logo">Clay Studio</div>
      <div>
        <div class="main-title">Rooted<br>in<br>Purpose</div>
        <div class="main-subtitle">Crafted with intention</div>
      </div>
      <div class="year">2025</div>
    </div>
    <div class="right">
      <div class="eyebrow">Presentation</div>
      <div class="right-title">Your Compelling<br>Title Goes Here</div>
      <div class="divider"></div>
      <div class="right-desc">A thoughtful subtitle that introduces your narrative with warmth and clarity, inviting your audience into the story you're about to tell.</div>
      <div class="tags">
        <div class="tag">Strategy</div>
        <div class="tag">Design</div>
        <div class="tag">Growth</div>
      </div>
    </div>
  </div>
</body>
</html>
